<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summary Report - WH4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Sarabun:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/report.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body class="bg-gray-100 min-h-screen antialiased text-gray-800">
    <div
      class="no-print fixed top-0 left-0 p-1 text-xs bg-white/50 text-gray-600 z-50 rounded-br-lg font-bold"
    >
      Made By Suwarot Thanabat L150081
    </div>

    <div class="p-4 md:p-8">
      <div
        id="summary-report-page"
        class="bg-white p-8 rounded-xl shadow-lg my-8 transition-opacity duration-300"
      >
        <div
          class="flex flex-col md:flex-row justify-between items-center mb-6 space-y-4 md:space-y-0"
        >
          <h2 class="text-3xl font-bold text-indigo-600">Summary Report</h2>
          <div class="flex items-center space-x-4">
            <img
              src="../picture/logo.png"
              alt="Logo"
              class="w-32 logo-blend"
              onerror="this.onerror=null;this.src='https://placehold.co/128x51/ffffff/334155?text=Logo';"
            />
            <div class="flex items-center space-x-2 no-print">
              <button
                id="print-report-btn"
                class="bg-slate-600 text-white px-4 py-2 rounded-lg shadow-md hover:bg-slate-700 transition-colors duration-200 text-sm"
              >
                Print
              </button>
              <button
                id="export-report-csv-btn"
                class="bg-blue-500 text-white px-4 py-2 rounded-lg shadow-md hover:bg-blue-600 transition-colors duration-200 text-sm"
              >
                Export to CSV
              </button>
              <a
                href="../index.html"
                class="bg-gray-400 text-white px-4 py-2 rounded-lg shadow-md hover:bg-gray-500 transition-colors duration-200 text-sm flex items-center no-underline"
                >Back to Menu</a
              >
            </div>
          </div>
        </div>

        <div
          class="no-print grid grid-cols-1 md:grid-cols-8 gap-4 mb-6 items-end p-4 border rounded-lg bg-gray-50"
        >
          <div>
            <label
              for="start-date"
              class="block text-sm font-medium text-gray-700"
              >Start Date</label
            >
            <input
              type="date"
              id="start-date"
              class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>
          <div>
            <label
              for="start-time"
              class="block text-sm font-medium text-gray-700"
              >Start Time</label
            >
            <input
              type="time"
              id="start-time"
              class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>
          <div>
            <label
              for="end-date"
              class="block text-sm font-medium text-gray-700"
              >End Date</label
            >
            <input
              type="date"
              id="end-date"
              class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>
          <div>
            <label
              for="end-time"
              class="block text-sm font-medium text-gray-700"
              >End Time</label
            >
            <input
              type="time"
              id="end-time"
              class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>
          <div>
            <label
              for="filter-status"
              class="block text-sm font-medium text-gray-700"
              >Status</label
            >
            <select
              id="filter-status"
              class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
              <option value="all">All</option>
              <option value="Empty-Out">Empty-Out</option>
              <option value="Empty-IN">Empty-IN</option>
            </select>
          </div>
          <div>
            <label
              for="filter-company"
              class="block text-sm font-medium text-gray-700"
              >Company</label
            >
            <select
              id="filter-company"
              class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
              <option value="all">All</option>
            </select>
          </div>
          <div>
            <label
              for="filter-zone"
              class="block text-sm font-medium text-gray-700"
              >Zone</label
            >
            <select
              id="filter-zone"
              class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
              <option value="all">All</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label
              for="filter-search"
              class="block text-sm font-medium text-gray-700"
              >Search (Supplier / Truck No / etc.)</label
            >
            <input
              type="text"
              id="filter-search"
              placeholder="e.g. supplier name, truck plate, driver, gatepass no..."
              class="mt-1 w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>
          <button
            id="fetch-report-btn"
            class="bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 h-10 disabled:opacity-60"
          >
            Fetch Report
          </button>
          <button
            id="clear-report-filters-btn"
            class="bg-amber-500 text-white py-2 px-4 rounded-md hover:bg-amber-600 h-10"
          >
            Clear
          </button>
        </div>

        <div id="report-result-count" class="text-sm text-gray-500 mb-2"></div>

        <div id="report-table-container">
          <table class="min-w-full bg-white">
            <thead>
              <tr
                class="bg-indigo-500 text-white uppercase text-sm leading-normal"
              >
                <th class="py-3 px-4 text-left">Status</th>
                <th class="py-3 px-4 text-left">Company</th>
                <th class="py-3 px-4 text-left">Zone</th>
                <th class="py-3 px-4 text-left">Supplier</th>
                <th class="py-3 px-4 text-left">PTB</th>
                <th class="py-3 px-4 text-left">CPB</th>
                <th class="py-3 px-4 text-left">MOV</th>
                <th class="py-3 px-4 text-left">STP</th>
                <th class="py-3 px-4 text-left">PL</th>
                <th class="py-3 px-4 text-left">RP</th>
              </tr>
            </thead>
            <tbody
              id="summary-report-table-body"
              class="text-gray-600 text-sm font-light"
            ></tbody>
            <tfoot
              id="summary-report-table-footer"
              class="font-bold text-sm"
            ></tfoot>
          </table>
        </div>
      </div>
    </div>

    <!-- Modal Alert -->
    <div
      id="alert-modal"
      class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 hidden"
    >
      <div
        class="relative top-20 mx-auto p-5 border w-full max-w-lg shadow-lg rounded-md bg-white"
      >
        <div class="mt-3 text-center">
          <h3
            id="modal-title"
            class="text-lg leading-6 font-medium text-gray-900 mt-2"
          ></h3>
          <div class="mt-2 px-7 py-3">
            <p id="modal-message" class="text-sm text-gray-500"></p>
          </div>
          <div class="items-center px-4 py-3">
            <button
              id="modal-close-btn"
              class="px-4 py-2 bg-red-500 text-white text-base font-medium rounded-md w-full"
            >
              OK
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../js/report.js"></script>
  	<script src="../js/responsive.js" defer></script>
  	<script src="../js/date-ddmmyyyy.js" defer></script>
  	<script type="module" src="../js/pending-sync.js"></script>
</body>
</html>
